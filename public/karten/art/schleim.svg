<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Hintergrund & Gluttony-Vortex -->
    <radialGradient id="spaceGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#24143d" />
      <stop offset="50%" stop-color="#120824" />
      <stop offset="100%" stop-color="#05020a" />
    </radialGradient>
    <radialGradient id="vortexGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0314" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#3d1266" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#7322bf" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <!-- Rimuru Schleim-Gradienten (Kristallin-Cyan) -->
    <linearGradient id="slimeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4f7ff" />
      <stop offset="25%" stop-color="#58dbff" />
      <stop offset="70%" stop-color="#18a2e8" />
      <stop offset="100%" stop-color="#096bb3" />
    </linearGradient>
    <radialGradient id="slimeHighlight" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a3f0ff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#18a2e8" stop-opacity="0" />
    </radialGradient>
    <filter id="slimeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hintergrund: Tiefer magischer Ätherraum -->
  <rect width="400" height="560" fill="url(#spaceGrad)" />

  <!-- Gluttony (Magenraum) Spiralen & Sog-Effekt -->
  <g transform="translate(200, 260)">
    <circle cx="0" cy="0" r="170" fill="url(#vortexGrad)" />
    <!-- Magische Sog-Bahnen -->
    <path d="M 0 -150 A 150 150 0 0 1 140 50 A 110 110 0 0 1 -70 80 A 60 60 0 0 1 0 0" fill="none" stroke="#b058ff" stroke-width="3" opacity="0.6" stroke-linecap="round" />
    <path d="M 0 140 A 140 140 0 0 1 -130 -40 A 100 100 0 0 1 60 -70 A 50 50 0 0 1 0 0" fill="none" stroke="#48dbfb" stroke-width="2.5" opacity="0.7" stroke-linecap="round" />
    <path d="M -110 90 A 130 130 0 0 1 120 -80 A 90 90 0 0 1 -30 -60" fill="none" stroke="#ffd23d" stroke-width="1.8" opacity="0.5" stroke-dasharray="4,6" />
    <!-- Verschlungene Kartenfragmente (Gluttony absorbiert die Karten) -->
    <polygon points="-90,-120 -60,-135 -50,-105 -80,-90" fill="#ffd23d" opacity="0.5" transform="rotate(25)" />
    <polygon points="100,100 125,85 140,110 115,125" fill="#ff3d7f" opacity="0.5" transform="rotate(-35)" />
    <polygon points="-120,40 -100,20 -85,45 -105,65" fill="#5cff8a" opacity="0.5" transform="rotate(15)" />
  </g>

  <!-- Magische Partikel -->
  <circle cx="80" cy="140" r="3" fill="#48dbfb" opacity="0.8" filter="url(#slimeGlow)" />
  <circle cx="320" cy="120" r="3.5" fill="#b058ff" opacity="0.8" filter="url(#slimeGlow)" />
  <circle cx="300" cy="400" r="2.5" fill="#48dbfb" opacity="0.7" />
  <circle cx="90" cy="380" r="3" fill="#ffd23d" opacity="0.7" />

  <!-- Rimuru Tempest (Kanonische Schleim-Physiognomie) -->
  <!-- Weiche, elastische Wassertropfen-Form mit physikalischer Boden-Auflage -->
  <g transform="translate(200, 310)">
    <!-- Schleim-Körper -->
    <path d="M -100 50 
             C -110 10, -95 -50, -65 -80 
             C -35 -110, 35 -110, 65 -80 
             C 95 -50, 110 10, 100 50 
             C 90 85, 50 95, 0 95 
             C -50 95, -90 85, -100 50 Z" 
          fill="url(#slimeBody)" stroke="#92ebff" stroke-width="2.5" />

    <!-- Innere Lichtbrechung / Highlight -->
    <path d="M -75 35 
             C -85 5, -70 -40, -45 -65 
             C -20 -85, 30 -85, 50 -60 
             C 20 -40, -40 -30, -55 20 
             C -65 45, -70 45, -75 35 Z" 
          fill="url(#slimeHighlight)" />

    <!-- Glanzpunkte oben links -->
    <ellipse cx="-45" cy="-60" rx="14" ry="7" fill="#ffffff" opacity="0.85" transform="rotate(-30, -45, -60)" />
    <circle cx="-62" cy="-45" r="4.5" fill="#ffffff" opacity="0.75" />

    <!-- Expressive Rimuru-Augen: Schlitzförmige, gebogene Mimik-Striche -->
    <path d="M -50 -10 Q -32 -22 -14 -10" stroke="#052c4a" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 14 -10 Q 32 -22 50 -10" stroke="#052c4a" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Freundliche Wimpern-Akzente -->
    <path d="M -50 -10 L -55 -15" stroke="#052c4a" stroke-width="3" stroke-linecap="round" />
    <path d="M 50 -10 L 55 -15" stroke="#052c4a" stroke-width="3" stroke-linecap="round" />

    <!-- Schüchterne/Niedliche Wangenröte (Blush) -->
    <ellipse cx="-45" cy="8" rx="10" ry="5" fill="#ff758c" opacity="0.55" />
    <ellipse cx="45" cy="8" rx="10" ry="5" fill="#ff758c" opacity="0.55" />
  </g>

  <!-- Karten-Titelbanner am Fuß -->
  <rect x="20" y="495" width="360" height="46" rx="10" fill="#070c1a" opacity="0.9" stroke="#3dc6ff" stroke-width="1.5" />
  <text x="200" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffd23d" letter-spacing="1">RIMURU TEMPEST</text>
  <text x="200" y="538" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#3dc6ff" letter-spacing="2">MAGENRAUM · GLUTTONY</text>
</svg>
