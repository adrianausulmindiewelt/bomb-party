<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Thron-Halle & Nebel-Gradienten -->
    <linearGradient id="hallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0510" />
      <stop offset="40%" stop-color="#180b26" />
      <stop offset="75%" stop-color="#2a0c2e" />
      <stop offset="100%" stop-color="#050208" />
    </linearGradient>
    <radialGradient id="magicAura" cx="50%" cy="55%" r="65%">
      <stop offset="0%" stop-color="#800020" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4a0e4e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="throneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2a38" />
      <stop offset="50%" stop-color="#1e1c26" />
      <stop offset="100%" stop-color="#100f14" />
    </linearGradient>
    <linearGradient id="anosCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#231b2b" />
      <stop offset="50%" stop-color="#120c17" />
      <stop offset="100%" stop-color="#07040a" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#150510" />
      <stop offset="50%" stop-color="#3d0b28" />
      <stop offset="100%" stop-color="#a31238" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hintergrund: Gotische Dämonenburg Delzogade -->
  <rect width="400" height="560" fill="url(#hallGrad)" />
  <rect width="400" height="560" fill="url(#magicAura)" />

  <!-- Gotische Bögen & Fenster -->
  <path d="M 60 0 L 60 220 Q 120 120 200 120 Q 280 120 340 220 L 340 0 Z" fill="#0d0714" opacity="0.6" />
  <path d="M 120 0 L 120 180 Q 160 130 200 130 Q 240 130 280 180 L 280 0 Z" fill="#150a21" opacity="0.4" />

  <!-- Rote Magie-Zirkel & Partikel (Venuzdonoa Resonanz) -->
  <circle cx="200" cy="280" r="140" fill="none" stroke="#a31238" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.35" />
  <circle cx="200" cy="280" r="165" fill="none" stroke="#7a1438" stroke-width="1" stroke-dasharray="12,14" opacity="0.25" />
  <circle cx="90" cy="180" r="2.5" fill="#e63946" opacity="0.8" filter="url(#crimsonGlow)" />
  <circle cx="310" cy="150" r="3" fill="#a31238" opacity="0.7" filter="url(#crimsonGlow)" />
  <circle cx="330" cy="340" r="2" fill="#e63946" opacity="0.6" />

  <!-- Der monumentale Steinthron -->
  <path d="M 90 560 L 110 240 L 130 180 L 270 180 L 290 240 L 310 560 Z" fill="url(#throneGrad)" />
  <path d="M 130 180 L 200 130 L 270 180 L 250 250 L 150 250 Z" fill="#252330" stroke="#3d3a4d" stroke-width="1.5" />
  <polygon points="120,240 80,260 80,480 120,440" fill="#18171f" />
  <polygon points="280,240 320,260 320,480 280,440" fill="#18171f" />

  <!-- Anos Voldigoad Gestalt (Souverän auf dem Thron) -->
  <!-- Dämonenlord-Robe & Mantel -->
  <path d="M 120 480 Q 150 280 170 260 L 230 260 Q 250 280 280 480 L 200 560 Z" fill="url(#anosCoat)" />
  <!-- Schulterkragen & weiße/silberne Akzente -->
  <polygon points="160,260 200,320 240,260 200,275" fill="#f0edf5" />
  <polygon points="180,275 200,310 220,275 200,285" fill="#a31238" />

  <!-- Arme entspannt auf den Thronlehnen -->
  <path d="M 150 280 L 105 350 L 115 365 L 165 310 Z" fill="#120c17" />
  <path d="M 250 280 L 295 350 L 285 365 L 235 310 Z" fill="#120c17" />
  <!-- Handschuhe -->
  <ellipse cx="108" cy="360" rx="9" ry="7" fill="#2b2333" stroke="#a31238" stroke-width="0.8" />
  <ellipse cx="292" cy="360" rx="9" ry="7" fill="#2b2333" stroke="#a31238" stroke-width="0.8" />

  <!-- Kopf, Hals & stoizistisches Gesicht -->
  <polygon points="188,255 200,275 212,255" fill="#f2e2d2" />
  <ellipse cx="200" cy="225" rx="22" ry="26" fill="#f5e6d6" />

  <!-- Kanonische burgunderrote Augen (un-aktiviert, überlegener ruhiger Blick) -->
  <ellipse cx="192" cy="224" rx="4" ry="2.2" fill="#110508" />
  <ellipse cx="208" cy="224" rx="4" ry="2.2" fill="#110508" />
  <circle cx="192" cy="224" r="1.8" fill="#800020" />
  <circle cx="208" cy="224" r="1.8" fill="#800020" />
  <circle cx="192.5" cy="223.5" r="0.6" fill="#ffffff" />
  <circle cx="208.5" cy="223.5" r="0.6" fill="#ffffff" />

  <!-- Augenbrauen & dezenter, stoischer Mund -->
  <path d="M 186 218 Q 192 216 198 219" stroke="#1c1824" stroke-width="1.4" fill="none" />
  <path d="M 214 218 Q 208 216 202 219" stroke="#1c1824" stroke-width="1.4" fill="none" />
  <path d="M 196 238 Q 200 240 204 238" stroke="#8a4f4f" stroke-width="1.2" fill="none" />

  <!-- Tiefschwarzes Haar (charakteristische Strähnen) -->
  <path d="M 175 220 Q 170 190 200 185 Q 230 190 225 220 Q 215 195 200 200 Q 185 195 175 220 Z" fill="#0d0912" />
  <path d="M 182 198 L 195 218 L 192 196 Z" fill="#140f1a" />
  <path d="M 218 198 L 205 218 L 208 196 Z" fill="#140f1a" />
  <path d="M 197 192 L 200 222 L 203 192 Z" fill="#0d0912" />

  <!-- Venuzdonoa (Das Prinzip-zerstörende Dämonenschwert, schwebend neben dem Thron) -->
  <g transform="translate(325, 140) rotate(14)">
    <!-- Schattige Aura -->
    <ellipse cx="0" cy="140" rx="14" ry="150" fill="#a31238" opacity="0.3" filter="url(#crimsonGlow)" />
    <!-- Klinge (dunkel-karmesin, gezackt, Logik-vernichtend) -->
    <path d="M -4 40 L -6 240 L 0 280 L 6 240 L 4 40 Z" fill="url(#bladeGrad)" stroke="#ff2a55" stroke-width="1" />
    <line x1="0" y1="40" x2="0" y2="270" stroke="#ff758c" stroke-width="0.8" opacity="0.8" />
    <!-- Parierstange & Griff -->
    <polygon points="-18,40 18,40 12,32 -12,32" fill="#2d0b1a" stroke="#ffd23d" stroke-width="1" />
    <rect x="-3" y="10" width="6" height="22" fill="#120c17" stroke="#ffd23d" stroke-width="0.8" />
    <circle cx="0" cy="8" r="5" fill="#a31238" stroke="#ffd23d" stroke-width="1" />
  </g>

  <!-- Karten-Titelbanner am Fuß -->
  <rect x="20" y="495" width="360" height="46" rx="10" fill="#0a0510" opacity="0.85" stroke="#a31238" stroke-width="1.5" />
  <text x="200" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffd23d" letter-spacing="1">ANOS VOLDIGOAD</text>
  <text x="200" y="538" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#ff758c" letter-spacing="2">DÄMONENKÖNIG DER TYRANNEI</text>
</svg>
