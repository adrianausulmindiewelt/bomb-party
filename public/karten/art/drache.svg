<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Erebor-Hallen-Gradient & Feuerschein -->
    <linearGradient id="ereborBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140804" />
      <stop offset="45%" stop-color="#240c06" />
      <stop offset="80%" stop-color="#3d1406" />
      <stop offset="100%" stop-color="#1a0602" />
    </linearGradient>
    <radialGradient id="fireFurnace" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#d9381e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <!-- Drachenschuppen-Gradient (Tiefrot & Obsidian) -->
    <linearGradient id="smaugScales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80100a" />
      <stop offset="50%" stop-color="#4a0805" />
      <stop offset="100%" stop-color="#210302" />
    </linearGradient>
    <linearGradient id="goldHoard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#735c0f" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hintergrund: Riesige Zwergenhalle von Erebor -->
  <rect width="400" height="560" fill="url(#ereborBg)" />
  <rect width="400" height="560" fill="url(#fireFurnace)" />

  <!-- Zwergische Steinsäulen im Hintergrund -->
  <rect x="30" y="0" width="45" height="320" fill="#170c08" opacity="0.6" />
  <rect x="325" y="0" width="45" height="320" fill="#170c08" opacity="0.6" />
  <polygon points="10,0 95,0 80,60 25,60" fill="#24120a" opacity="0.7" />
  <polygon points="305,0 390,0 375,60 320,60" fill="#24120a" opacity="0.7" />

  <!-- Aufsteigender Rauch & Aschepartikel -->
  <circle cx="160" cy="140" r="2.5" fill="#ffd23d" opacity="0.8" filter="url(#goldGlow)" />
  <circle cx="240" cy="110" r="3" fill="#ff4d4d" opacity="0.7" filter="url(#goldGlow)" />
  <circle cx="90" cy="200" r="2" fill="#ffd23d" opacity="0.6" />
  <circle cx="310" cy="180" r="2.5" fill="#ff7b00" opacity="0.6" />

  <!-- Smaug: Der gewaltige Feuerdrache (Kopf & Hals über dem Schatz) -->
  <g transform="translate(200, 240)">
    <!-- Mächtiger geschuppter Hals -->
    <path d="M -70 120 C -60 40, -40 -20, 20 -70 L 80 -40 C 40 20, 30 80, 50 140 Z" fill="url(#smaugScales)" stroke="#260402" stroke-width="2" />
    <!-- Halskamm / Stacheln -->
    <polygon points="-50,40 -75,25 -45,20" fill="#a81c13" />
    <polygon points="-35,-5 -60,-20 -30,-25" fill="#a81c13" />
    <polygon points="-10,-45 -30,-65 -5,-60" fill="#a81c13" />

    <!-- Glühender Feuer-Schlund (Magma in der Kehle) -->
    <path d="M -15 20 Q 0 -10 15 20 Q 0 50 -15 20" fill="#ff9900" opacity="0.7" filter="url(#goldGlow)" />

    <!-- Smaugs Kopf (Reptilisch, kantig, gepanzert) -->
    <polygon points="-10,-85 65,-120 115,-85 125,-60 85,-45 40,-50" fill="#5e0c07" stroke="#260402" stroke-width="2" />
    <polygon points="65,-120 125,-140 105,-110" fill="#80100a" /> <!-- Kopfhorn oben -->
    <polygon points="50,-115 90,-130 80,-105" fill="#380704" />
    <polygon points="85,-45 130,-50 100,-35" fill="#80100a" /> <!-- Unterkiefer-Stachel -->

    <!-- Schnauze & Zähne (Wie Schwerter) -->
    <polygon points="85,-75 95,-70 88,-65" fill="#f5eedc" />
    <polygon points="100,-75 110,-70 103,-65" fill="#f5eedc" />
    <polygon points="70,-75 80,-70 73,-65" fill="#f5eedc" />

    <!-- Glühendes, intelligentes Drachenauge (Böser Bernstein) -->
    <ellipse cx="65" cy="-85" rx="9" ry="6" fill="#ffd23d" transform="rotate(-15, 65, -85)" filter="url(#goldGlow)" />
    <!-- Senkrechte Schlitz-Pupille -->
    <line x1="65" y1="-90" x2="65" y2="-80" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <!-- Nüster & Rauch -->
    <ellipse cx="112" cy="-70" rx="3" ry="2" fill="#170302" />
    <path d="M 115 -70 Q 135 -90 145 -80 Q 155 -70 170 -90" stroke="#888888" stroke-width="2" fill="none" opacity="0.4" />

    <!-- Die kahle Stelle an der linken Brust (Verwundbarkeit durch den Schwarzen Pfeil) -->
    <circle cx="20" cy="90" r="14" fill="#1a0402" stroke="#ff3d7f" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.8" />
    <circle cx="20" cy="90" r="3" fill="#ff758c" />
  </g>

  <!-- Der monumentale Goldschatz von Erebor (Berge aus Goldmünzen, Kelchen & Juwelen) -->
  <g transform="translate(0, 360)">
    <path d="M -20 100 Q 80 10 200 40 Q 320 20 420 100 L 420 200 L -20 200 Z" fill="url(#goldHoard)" stroke="#4a3b0a" stroke-width="2" />
    <!-- Goldmünzen-Struktur & Glanzpunkte -->
    <circle cx="80" cy="80" r="10" fill="#fff3a8" opacity="0.8" />
    <circle cx="140" cy="65" r="8" fill="#ffd23d" />
    <circle cx="210" cy="75" r="11" fill="#fff3a8" opacity="0.7" />
    <circle cx="280" cy="60" r="9" fill="#ffd23d" />
    <circle cx="340" cy="85" r="12" fill="#fff3a8" opacity="0.8" />

    <!-- Juwelen im Gold (Rubine, Smaragde, Saphire) -->
    <polygon points="110,85 120,70 130,85 120,100" fill="#ff2a55" filter="url(#goldGlow)" />
    <polygon points="250,70 262,60 274,70 262,80" fill="#3dc6ff" filter="url(#goldGlow)" />
    <polygon points="175,90 185,78 195,90 185,102" fill="#5cff8a" filter="url(#goldGlow)" />
  </g>

  <!-- Karten-Titelbanner am Fuß -->
  <rect x="20" y="495" width="360" height="46" rx="10" fill="#0d0402" opacity="0.9" stroke="#ffd23d" stroke-width="1.5" />
  <text x="200" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffd23d" letter-spacing="1">SMAUG DER GOLDENE</text>
  <text x="200" y="538" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10.5" fill="#ff7b00" letter-spacing="2">DRACHENHORT VON EREBOR</text>
</svg>
