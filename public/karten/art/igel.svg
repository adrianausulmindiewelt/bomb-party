<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143d24" />
      <stop offset="40%" stop-color="#1e5c36" />
      <stop offset="75%" stop-color="#0f2918" />
      <stop offset="100%" stop-color="#08140c" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff5a6" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#a8ff78" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#143d24" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78ffd6" />
      <stop offset="50%" stop-color="#48c6ef" />
      <stop offset="100%" stop-color="#2ecc71" />
    </linearGradient>
    <linearGradient id="hedgeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f5e9" />
    </linearGradient>
    <linearGradient id="foliageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8ff78" />
      <stop offset="45%" stop-color="#43e97b" />
      <stop offset="100%" stop-color="#1b8543" />
    </linearGradient>
    <linearGradient id="flowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff3d7f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Magischer Wald-Hintergrund -->
  <rect width="400" height="560" fill="url(#bgGrad)" />
  <circle cx="200" cy="180" r="160" fill="url(#sunGlow)" />

  <!-- Sonnenstrahlen im Wald -->
  <polygon points="120,0 280,0 350,560 50,560" fill="#ffffff" opacity="0.04" />
  <polygon points="180,0 240,0 290,560 110,560" fill="#ffd23d" opacity="0.05" />

  <!-- Schwebende magische Blätter & Pollen im Hintergrund -->
  <circle cx="80" cy="120" r="3" fill="#a8ff78" opacity="0.7" filter="url(#glow)" />
  <circle cx="310" cy="90" r="4" fill="#ffd23d" opacity="0.8" filter="url(#glow)" />
  <circle cx="340" cy="220" r="2.5" fill="#a8ff78" opacity="0.6" />
  <circle cx="60" cy="280" r="3.5" fill="#ffd23d" opacity="0.7" />
  <circle cx="150" cy="70" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="270" cy="160" r="3" fill="#a8ff78" opacity="0.6" />

  <!-- Waldboden-Hügel -->
  <ellipse cx="200" cy="510" rx="220" ry="85" fill="#11331c" />
  <ellipse cx="200" cy="530" rx="180" ry="60" fill="#0b2413" />

  <!-- 🦔 SHAYMIN / IGEL DER BLÄTTER -->
  <!-- Weicher Schatten -->
  <ellipse cx="200" cy="450" rx="110" ry="24" fill="#05120a" opacity="0.5" />

  <!-- Grüner Blätter-/Moos-Rücken (Foliage Quills) -->
  <g id="foliage">
    <!-- Blätter-Büschel 1 (Basis) -->
    <path d="M120,380 C110,300 150,220 220,220 C290,220 330,300 320,380 Z" fill="url(#foliageGrad)" />
    <!-- Grasbüschel Spitzen -->
    <path d="M125,320 Q100,280 120,260 Q145,290 140,320 Z" fill="#78ffd6" />
    <path d="M150,270 Q135,220 165,225 Q175,260 165,285 Z" fill="#a8ff78" />
    <path d="M190,240 Q185,180 215,195 Q225,230 210,255 Z" fill="#a8ff78" />
    <path d="M235,245 Q255,190 280,215 Q275,250 255,265 Z" fill="#78ffd6" />
    <path d="M275,275 Q310,240 320,270 Q305,295 285,305 Z" fill="#5cff8a" />
    <path d="M295,315 Q335,295 330,330 Q305,340 290,340 Z" fill="#38ef7d" />
  </g>

  <!-- Weißer Körper (Kopf & Pfötchen) -->
  <g id="body">
    <!-- Körper-Oval -->
    <ellipse cx="185" cy="400" rx="75" ry="55" fill="url(#hedgeBody)" stroke="#d4eed9" stroke-width="2" />

    <!-- Vorderpfötchen -->
    <ellipse cx="140" cy="445" rx="18" ry="12" fill="#ffffff" stroke="#c8e6c9" stroke-width="1.5" />
    <ellipse cx="215" cy="448" rx="18" ry="12" fill="#ffffff" stroke="#c8e6c9" stroke-width="1.5" />

    <!-- Niedliches Igel-Gesicht -->
    <path d="M110,395 Q140,430 185,420 Q205,380 170,350 Q130,350 110,395 Z" fill="#ffffff" />
    <ellipse cx="112" cy="392" rx="6" ry="4" fill="#3a3760" /> <!-- Stupsnase -->

    <!-- Großes, treues Kullerauge -->
    <ellipse cx="145" cy="375" rx="12" ry="16" fill="#1b4d3e" />
    <ellipse cx="145" cy="375" rx="8" ry="12" fill="#2d7a5b" />
    <circle cx="142" cy="370" r="5" fill="#ffffff" /> <!-- Glanzlicht -->
    <circle cx="148" cy="382" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Sanftes Lächeln & Bäckchen -->
    <path d="M125,402 Q135,408 145,402" stroke="#4a6b57" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <ellipse cx="158" cy="396" rx="10" ry="6" fill="#ff758c" opacity="0.45" /> <!-- Rosa Wange -->
  </g>

  <!-- Rosa Gracidea-Blüte an der Seite -->
  <g id="flower" transform="translate(190, 340)">
    <!-- Blütenblätter -->
    <ellipse cx="0" cy="-22" rx="12" ry="18" fill="url(#flowerGrad)" />
    <ellipse cx="20" cy="-10" rx="12" ry="18" transform="rotate(65 20 -10)" fill="url(#flowerGrad)" />
    <ellipse cx="14" cy="18" rx="12" ry="18" transform="rotate(135 14 18)" fill="url(#flowerGrad)" />
    <ellipse cx="-14" cy="18" rx="12" ry="18" transform="rotate(-135 -14 18)" fill="url(#flowerGrad)" />
    <ellipse cx="-20" cy="-10" rx="12" ry="18" transform="rotate(-65 -20 -10)" fill="url(#flowerGrad)" />
    <!-- Gelbes Blütenzentrum -->
    <circle cx="0" cy="0" r="8" fill="#ffd23d" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#ff9100" />
  </g>

  <!-- Frische Tau-Tropfen auf den Blättern -->
  <circle cx="170" cy="235" r="4.5" fill="#ffffff" opacity="0.9" />
  <circle cx="250" cy="225" r="3.5" fill="#ffffff" opacity="0.85" />
  <circle cx="295" cy="285" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Aufsteigende Natur-Funken / Lichtpartikel -->
  <polygon points="190,130 195,145 210,150 195,155 190,170 185,155 170,150 185,145" fill="#ffd23d" opacity="0.85" />
  <polygon points="260,110 263,120 273,123 263,126 260,136 257,126 247,123 257,120" fill="#a8ff78" opacity="0.8" />
  <polygon points="120,180 123,190 133,193 123,196 120,206 117,196 107,193 117,190" fill="#78ffd6" opacity="0.75" />

</svg>
