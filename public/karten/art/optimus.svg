<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Hintergrund-Verlauf: Tiefer Cybertron-Nachthimmel -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#101a33" />
      <stop offset="80%" stop-color="#180e29" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <!-- Autobot Rot Metallic -->
    <linearGradient id="primeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e" />
      <stop offset="40%" stop-color="#d61b2e" />
      <stop offset="100%" stop-color="#800a16" />
    </linearGradient>

    <!-- Autobot Blau Metallic -->
    <linearGradient id="primeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4db" />
      <stop offset="40%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#002b66" />
    </linearGradient>

    <!-- Chrom & Titanium -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#dce6f0" />
      <stop offset="70%" stop-color="#8da0b3" />
      <stop offset="100%" stop-color="#4a5866" />
    </linearGradient>

    <!-- Energon Cyan Leuchten -->
    <radialGradient id="energonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0099ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0044ff" stop-opacity="0" />
    </radialGradient>

    <!-- Speed Lines Gradient -->
    <linearGradient id="speedGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ff3b4e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="400" height="560" fill="url(#bgGrad)" />

  <!-- Cybernetic Grid & Speed Rays am Boden -->
  <g opacity="0.35">
    <path d="M-50 560 L200 240 L450 560" stroke="#00b4db" stroke-width="1.5" fill="none" />
    <path d="M20 560 L200 240 L380 560" stroke="#00b4db" stroke-width="1.5" fill="none" />
    <path d="M100 560 L200 240 L300 560" stroke="#00b4db" stroke-width="1.5" fill="none" />
    <line x1="0" y1="360" x2="400" y2="360" stroke="#00b4db" stroke-width="1" />
    <line x1="0" y1="420" x2="400" y2="420" stroke="#00b4db" stroke-width="1.5" />
    <line x1="0" y1="490" x2="400" y2="490" stroke="#00b4db" stroke-width="2" />
  </g>

  <!-- Glühender Energon-Lichthof -->
  <circle cx="200" cy="200" r="160" fill="url(#energonGlow)" />

  <!-- Dynamische Speedlines / Rollout-Funken -->
  <g opacity="0.7">
    <line x1="60" y1="460" x2="30" y2="540" stroke="#ffd23d" stroke-width="3" stroke-linecap="round" />
    <line x1="340" y1="460" x2="370" y2="540" stroke="#ffd23d" stroke-width="3" stroke-linecap="round" />
    <line x1="80" y1="380" x2="40" y2="440" stroke="#ff3b4e" stroke-width="2.5" stroke-linecap="round" />
    <line x1="320" y1="380" x2="360" y2="440" stroke="#ff3b4e" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- 🚛 OPTIMUS PRIME HELM & TRUCK FAÇADE (HEROIC ICON) -->
  <g transform="translate(0, 10)">
    <!-- Auspuffrohre / Smokestacks (Chrom) -->
    <rect x="76" y="80" width="16" height="230" rx="4" fill="url(#chrome)" stroke="#222" stroke-width="2" />
    <rect x="308" y="80" width="16" height="230" rx="4" fill="url(#chrome)" stroke="#222" stroke-width="2" />
    <polygon points="76,80 92,80 84,55" fill="url(#chrome)" />
    <polygon points="308,80 324,80 316,55" fill="url(#chrome)" />

    <!-- Schulter- & Rumpfpanzerung (Rot) -->
    <path d="M96 190 L130 150 L270 150 L304 190 L320 280 L290 320 L110 320 L80 280 Z" fill="url(#primeRed)" stroke="#55000a" stroke-width="3" />

    <!-- Brust-Fenster / Windschutzscheibe (Energon Cyan) -->
    <polygon points="125 180 192 180 188 235 125 235" fill="#002b66" stroke="#00ffff" stroke-width="3" />
    <polygon points="128 184 189 184 185 231 128 231" fill="#00b4db" opacity="0.85" />
    <polygon points="132 188 160 188 140 227 132 227" fill="#ffffff" opacity="0.6" />

    <polygon points="208 180 275 180 275 235 212 235" fill="#002b66" stroke="#00ffff" stroke-width="3" />
    <polygon points="211 184 272 184 272 231 215 231" fill="#00b4db" opacity="0.85" />
    <polygon points="215 188 243 188 223 227 215 227" fill="#ffffff" opacity="0.6" />

    <!-- Kühlergrill / Bauchplatte (Silber Chrom) -->
    <rect x="135" y="245" width="130" height="70" rx="4" fill="url(#chrome)" stroke="#1a202c" stroke-width="3" />
    <line x1="145" y1="258" x2="255" y2="258" stroke="#111" stroke-width="2.5" />
    <line x1="145" y1="270" x2="255" y2="270" stroke="#111" stroke-width="2.5" />
    <line x1="145" y1="282" x2="255" y2="282" stroke="#111" stroke-width="2.5" />
    <line x1="145" y1="294" x2="255" y2="294" stroke="#111" stroke-width="2.5" />
    <line x1="145" y1="306" x2="255" y2="306" stroke="#111" stroke-width="2.5" />

    <!-- Scheinwerfer (Hell leuchtend) -->
    <rect x="94" y="250" width="32" height="24" rx="4" fill="#ffd23d" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />
    <rect x="274" y="250" width="32" height="24" rx="4" fill="#ffd23d" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />

    <!-- Roboter-Kopf (Blauer Helm mit Ohren-Finnen) -->
    <!-- Helm-Seiten / Finnen -->
    <polygon points="145 95 130 50 145 40 152 90" fill="url(#primeBlue)" stroke="#001833" stroke-width="2" />
    <polygon points="255 95 270 50 255 40 248 90" fill="url(#primeBlue)" stroke="#001833" stroke-width="2" />

    <!-- Helm Kuppel & Stirnkamm -->
    <path d="M150 95 L165 60 L200 52 L235 60 L250 95 L245 135 L155 135 Z" fill="url(#primeBlue)" stroke="#001833" stroke-width="2.5" />
    <polygon points="194 52 206 52 204 90 196 90" fill="url(#chrome)" />

    <!-- Visor / Augen (Leuchtendes Cyan) -->
    <rect x="168" y="90" width="64" height="12" rx="3" fill="#00ffff" filter="url(#neonGlow)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Mundschutzplatte (Chrom Plate) -->
    <polygon points="172 108 228 108 222 136 200 144 178 136" fill="url(#chrome)" stroke="#222" stroke-width="2" />
    <line x1="200" y1="108" x2="200" y2="142" stroke="#444" stroke-width="2" />

    <!-- Autobot Wappen (Brustmitte) -->
    <g transform="translate(182, 142) scale(0.7)">
      <polygon points="25 0 45 15 40 38 33 42 33 50 25 45 17 50 17 42 10 38 5 15" fill="#ff3b4e" stroke="#ffffff" stroke-width="2" />
      <rect x="13" y="16" width="6" height="10" fill="#ffffff" />
      <rect x="31" y="16" width="6" height="10" fill="#ffffff" />
      <polygon points="25 22 28 32 22 32" fill="#ffffff" />
    </g>

    <!-- Untere Stoßstange / Bumper (Chrom & Nieten) -->
    <rect x="65" y="325" width="270" height="28" rx="6" fill="url(#chrome)" stroke="#111" stroke-width="3" />
    <circle cx="85" cy="339" r="4" fill="#333" />
    <circle cx="115" cy="339" r="4" fill="#333" />
    <circle cx="285" cy="339" r="4" fill="#333" />
    <circle cx="315" cy="339" r="4" fill="#333" />

    <!-- Vorderräder / Bereifung -->
    <rect x="52" y="270" width="24" height="80" rx="8" fill="#141414" stroke="#444" stroke-width="2" />
    <rect x="324" y="270" width="24" height="80" rx="8" fill="#141414" stroke="#444" stroke-width="2" />
  </g>

  <!-- Schriftzug / Banner unten -->
  <g transform="translate(200, 480)" text-anchor="middle">
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#ffd23d" letter-spacing="3" filter="url(#neonGlow)">AUTOBOTS, ROLL OUT!</text>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="28" fill="#ffffff" letter-spacing="3">AUTOBOTS, ROLL OUT!</text>
  </g>
</svg>
